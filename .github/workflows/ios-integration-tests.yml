name: iOS Integration Tests (WebdriverIO)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios-integration-tests:
    name: iOS Integration Tests (Simulator)
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Install Appium XCUITest Driver
        run: npx appium driver install xcuitest

      - name: Download iOS Simulator App
        run: |
          mkdir -p app/ios
          IOS_APP_URL="https://github.com/webdriverio/native-demo-app/releases/download/v2.2.0/ios.simulator.wdio.native.app.v2.2.0.zip"
          echo "Downloading iOS Simulator app package..."
          curl --retry 5 --retry-delay 2 --retry-all-errors -fL "$IOS_APP_URL" -o app/ios/ios.simulator.wdio.native.app.v2.2.0.zip
          ls -lh app/ios/ios.simulator.wdio.native.app.v2.2.0.zip

      - name: Boot iOS Simulator
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          echo "Creating and booting iPhone 15 Simulator..."
          UDID=$(xcrun simctl create "iPhone 15" "com.apple.CoreSimulator.SimDeviceType.iPhone-15" "com.apple.CoreSimulator.SimRuntime.iOS-17-5" || true)
          if [ -n "$UDID" ]; then
            xcrun simctl boot "$UDID" || true
          fi
          xcrun simctl list devices | grep -E "iPhone 15|Booted"

      - name: Run WebdriverIO tests on iOS Simulator
        run: |
          mkdir -p reports logs
          set -o pipefail
          npx wdio run ./config/wdio.ios.local.conf.js 2>&1 | tee reports/wdio-ios.log
        continue-on-error: true

      - name: Gerar Allure report (iOS)
        if: always()
        run: |
          npx allure generate --single-file reports/allure-results-ios --clean -o reports/allure-report-ios
        continue-on-error: true

      - name: Upload iOS test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-wdio-artifacts
          path: |
            reports/allure-results-ios
            reports/allure-report-ios/index.html
            reports/wdio-ios.log
            logs
          retention-days: 30

      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages  # default: gh-pages
          publish_dir: reports/allure-report-ios
          destination_dir: allure-report-ios

      - name: Job summary
        if: always()
        run: |
          echo "## iOS Integration Tests (WebdriverIO)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🍏 Device: iPhone 15" >> $GITHUB_STEP_SUMMARY
          echo "📱 Runtime: iOS 17.5" >> $GITHUB_STEP_SUMMARY
          echo "📦 Artifacts: ios-wdio-artifacts (allure-report-ios, logs, wdio-ios.log)" >> $GITHUB_STEP_SUMMARY
