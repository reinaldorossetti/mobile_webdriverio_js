name: BrowserStack Mobile Tests (Disabled)

on:
  workflow_dispatch:

permissions:
  contents: write
jobs:
  browserstack-tests:
    # Desativado no momento. Para habilitar, troque para:
    # if: ${{ secrets.BROWSERSTACK_USERNAME != '' && secrets.BROWSERSTACK_ACCESS_KEY != '' && secrets.BROWSERSTACK_APP_URL != '' }}
    if: ${{ false }}
    name: BrowserStack Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Run BrowserStack tests
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_APP_URL: ${{ secrets.BROWSERSTACK_APP_URL }}
        run: |
          mkdir -p reports logs
          npm run test:browserstack | tee reports/wdio-browserstack.log

      - name: Gerar Allure single-file
        if: always()
        run: |
          npx allure generate --single-file reports/allure-results --clean -o reports/allure-report
        continue-on-error: true

      - name: Upload BrowserStack artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browserstack-wdio-artifacts
          path: |
            reports/allure-results
            reports/allure-report/index.html
            reports/screenshots
            reports/page-sources
            reports/wdio-browserstack.log
            logs
          retention-days: 30

      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages  # default: gh-pages
          publish_dir: reports/allure-report
          destination_dir: allure-report