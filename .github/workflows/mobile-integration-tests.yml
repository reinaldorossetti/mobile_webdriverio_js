name: Mobile Integration Tests (WebdriverIO)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  android-integration-tests:
    name: Android Integration Tests (Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Android APK exists
        run: |
          mkdir -p app/android
          if [ ! -f app/android/android.wdio.native.app.v2.2.0.apk ]; then
            if [ -n "${{ secrets.ANDROID_APP_URL }}" ]; then
              echo "Downloading APK from ANDROID_APP_URL secret..."
              curl -fL "${{ secrets.ANDROID_APP_URL }}" -o app/android/android.wdio.native.app.v2.2.0.apk
            else
              echo "APK not found at app/android/android.wdio.native.app.v2.2.0.apk"
              echo "Set repository secret ANDROID_APP_URL with a direct APK download URL."
              exit 1
            fi
          fi

      - name: Install Appium UiAutomator2 driver
        run: npx appium driver install uiautomator2

      - name: Run tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_7_pro
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -no-boot-anim -noaudio
          disable-animations: true
          script: |
            mkdir -p reports logs
            adb devices
            npm run test:android | tee reports/wdio-android.log
            TEST_EXIT=${PIPESTATUS[0]}
            exit ${TEST_EXIT}

      - name: Gerar PDF do Allure Report
        if: always()
        run: |
          npx allure generate --single-file reports/allure-results --clean -o reports/allure-report
        continue-on-error: true

      - name: Upload RestAssured Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: |
            reports/allure-report/index.html
          retention-days: 30

      - name: Upload Android test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-wdio-artifacts
          path: |
            reports/allure-results
            reports/wdio-android.log
            logs
          retention-days: 30

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages  # default: gh-pages
          publish_dir: target/allure-report
          destination_dir: allure-report

      - name: Job summary
        if: always()
        run: |
          echo "## Android Integration Tests (WebdriverIO)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Emulator API Level: 34" >> $GITHUB_STEP_SUMMARY
          echo "📱 Profile: Pixel 7 Pro" >> $GITHUB_STEP_SUMMARY
          echo "📦 Artifacts: allure-results, logs, wdio-android.log" >> $GITHUB_STEP_SUMMARY

