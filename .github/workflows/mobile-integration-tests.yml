name: Mobile Integration Tests (WebdriverIO)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  android-integration-tests:
    name: Android Integration Tests (Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Android APK
        run: |
          mkdir -p app/android
          APK_URL="https://github.com/webdriverio/native-demo-app/releases/download/v2.2.0/android.wdio.native.app.v2.2.0.apk"
          echo "Downloading APK from release URL..."
          curl --retry 5 --retry-delay 2 --retry-all-errors -fL "$APK_URL" -o app/android/android.wdio.native.app.v2.2.0.apk
          ls -lh app/android/android.wdio.native.app.v2.2.0.apk

      - name: Run WebdriverIO tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_7_pro
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -no-boot-anim -noaudio
          disable-animations: true
          script: |
            mkdir -p reports logs
            adb devices
            npx wdio run ./config/wdio.android.local.conf.js | tee reports/wdio-android.log
            TEST_EXIT=${PIPESTATUS[0]}
            exit ${TEST_EXIT}
        continue-on-error: true

      - name: Gerar PDF do Allure Report
        if: always()
        run: |
          npx allure generate --single-file reports/allure-results --clean -o reports/allure-report
        continue-on-error: true

      - name: Upload RestAssured Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: |
            reports/allure-report/index.html
          retention-days: 30

      - name: Upload Android test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-wdio-artifacts
          path: |
            reports/allure-results
            reports/wdio-android.log
            logs
          retention-days: 30

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages  # default: gh-pages
          publish_dir: reports/allure-report
          destination_dir: allure-report

      - name: Job summary
        if: always()
        run: |
          echo "## Android Integration Tests (WebdriverIO)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Emulator API Level: 34" >> $GITHUB_STEP_SUMMARY
          echo "📱 Profile: Pixel 7 Pro" >> $GITHUB_STEP_SUMMARY
          echo "📦 Artifacts: allure-results, logs, wdio-android.log" >> $GITHUB_STEP_SUMMARY

